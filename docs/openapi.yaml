openapi: 3.1.0
info:
  title: ODS DocEditor API
  version: "1.0.0"
  summary: Multi-tenant structured document authoring and versioning.
  description: |
    DocEditor is the shared document authoring and versioning service of the ODS
    Platform. Products bring their own rich-text component; DocEditor owns the
    canonical storage, the immutable version history and the tenant isolation.

    **Versioning model.** A document is created at version 1, whose body is
    snapshotted immediately. Every subsequent change to `content` advances
    `current_version` and writes a new immutable version row in the same
    transaction. Products may also take an explicit snapshot at any time via
    `POST /documents/{id}/versions`. Version rows are insert-only: there is no
    update or delete path on them.

    **Tenancy.** The tenant is taken from the validated `tenant_id` claim of the
    OID JWT, never from a request field or header. `X-Tenant-Id` is accepted and
    logged for traceability only.

    **Events.** Every state change emits a CloudEvents v1.0 message to the
    configured Redpanda topic, in binary content mode: attributes travel as
    `ce_*` headers (`ce_specversion`, `ce_id`, `ce_source`, `ce_type`, `ce_time`,
    `ce_tenantid`, and `ce_correlationid` when the request carried one), and the
    body carries the event data. Messages are keyed by document id so a
    document's history keeps its order.

    Published per BR-0007 (OpenAPI 3.1, validated in CI). BR-0007 enumerates
    eight services and does not name doceditor; this contract is published
    against the service's own GTM gate ("required before Phase 2"), in the
    format BR-0007 mandates.
  contact:
    name: ODS Platform
  license:
    name: Proprietary

servers:
  - url: https://doceditor.staging.orbusdigital.com
    description: Staging
  - url: http://127.0.0.1:8087
    description: Local development

tags:
  - name: health
    description: Unauthenticated probes.
  - name: documents
    description: Document lifecycle.
  - name: versions
    description: Immutable version history.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness probe
      description: Answers without authentication and without touching the database.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: doceditor }
                  version: { type: string, examples: ["0.1.0"] }

  /healthz:
    get:
      tags: [health]
      summary: Liveness probe (container-level alias of /health)
      description: |
        Identical to `/health`, kept because BR-0016 requires the image to
        answer 200 on both paths.

        **Do not probe this on a deployed instance.** Google's front end
        intercepts `/healthz` above Cloud Run and returns its own 404 (1 568
        bytes, no `x-cloud-trace-context` header) before the container is
        reached, whatever nginx, IAP or the load balancer are configured to do.
        A deployed health check must use `/health`.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: doceditor }
                  version: { type: string, examples: ["0.1.0"] }

  /ready:
    get:
      tags: [health]
      summary: Readiness probe
      description: Answers without authentication; verifies database connectivity.
      security: []
      responses:
        "200":
          description: The database is reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string, const: ok }
                  database: { type: string, const: connected }
        "503":
          description: The database is unreachable; do not route traffic here.
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string, const: unavailable }
                  database: { type: string, const: disconnected }

  /api/v1/documents:
    post:
      tags: [documents]
      summary: Create a document
      description: |
        Creates a document in `draft` at version 1 and snapshots its body as
        version 1. `content` and `template_id` are mutually exclusive.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/SourceService"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDocumentRequest" }
      responses:
        "201":
          description: Created.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The referenced template does not exist for this tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"

    get:
      tags: [documents]
      summary: List documents
      description: |
        Tenant-scoped, paginated, newest-updated first. Bodies are **not**
        included: fetch the document itself for those.

        `page` and `per_page` are normalised rather than refused — a page past
        the end of a collection is a legitimate question with an empty answer —
        and **the response reports the normalised values**, not the ones that
        were sent. Paginate on what comes back: `?per_page=1000` answers
        `"per_page": 100` above at most a hundred documents, and `?page=0`
        answers `"page": 1` above the first page.

        **A parameter whose value is blank is a parameter that was not
        supplied**, for all four of them: `?page=&per_page=&status=&search=`
        — what a form submits when nothing was typed into it — answers exactly
        like a request with no query string at all. A value that is *not* blank
        is used exactly as it was sent, which is why a trailing space is still
        a typo for `status`.
      parameters:
        - name: page
          in: query
          required: false
          description: |
            Below 1 is served as 1. Past the end of the collection is an empty
            page, at any magnitude an `int64` can hold.

            A value that is not a whole number is a `400` naming this
            parameter — `5.5`, `abc`, or a number wider than an `int64`.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          required: false
          description: |
            Clamped to 100, and the clamped value is what is reported. A value
            that is not a whole number is a `400` naming this parameter.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          required: false
          description: |
            A value outside this enumeration is a `400`, not an empty page: a
            typo must not read as "you own no documents". A trailing space is
            such a typo (`?status=published%20`) and is refused as one.
          schema: { $ref: "#/components/schemas/DocumentStatus" }
        - name: search
          in: query
          required: false
          description: |
            Full-text search over the title and the body. **An empty or blank
            value is not a search**: it is no filter at all, and the whole
            collection is served — a client that always sends the parameter is
            not told that it owns nothing.

            Matching covers the **first 250 000 characters** of a document —
            the title, then the beginning of the body. A larger document is
            still stored, served and versioned whole; only the tail of its body
            is outside the index. PostgreSQL cannot index more than that in one
            `tsvector`, and indexing the whole body made documents above
            roughly 0.8 MB of varied text impossible to create at all. See
            ADR-006.
          schema: { type: string }
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/SourceService"
      responses:
        "200":
          description: A page of documents.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          content:
            application/json:
              schema:
                type: object
                required: [documents, total, page, per_page]
                properties:
                  documents:
                    type: array
                    items: { $ref: "#/components/schemas/DocumentSummary" }
                  total:
                    type: integer
                    description: Size of the whole collection, not of the page.
                  page:
                    type: integer
                    minimum: 1
                    description: The page that was served, after normalisation.
                  per_page:
                    type: integer
                    minimum: 1
                    maximum: 100
                    description: The page size that was applied, after clamping.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/documents/{id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/CorrelationId"
      - $ref: "#/components/parameters/SourceService"
    get:
      tags: [documents]
      summary: Retrieve a document, body included
      responses:
        "200":
          description: The document.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [documents]
      summary: Update a document
      description: |
        Any omitted field is left untouched. Supplying `content` advances
        `current_version` and writes an immutable version row.

        Status transitions are restricted: `draft -> published`,
        `draft -> archived`, `published -> archived`. Anything else is a 400,
        including a return to `draft`.

        Concurrent writers on the same document are serialised server-side:
        both edits succeed, each takes its own version number, and the body of
        whichever committed last is the current one. There is no `If-Match`
        precondition and no 409 — restoring the other edit is done through the
        version history.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDocumentRequest" }
      responses:
        "200":
          description: The updated document.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags: [documents]
      summary: Soft-delete a document
      description: |
        The document is hidden from reads and its status becomes `archived`, but
        the row and its whole version history are retained.
      responses:
        "204":
          description: Deleted.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/documents/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/CorrelationId"
      - $ref: "#/components/parameters/SourceService"
    post:
      tags: [versions]
      summary: Take an explicit version snapshot
      description: |
        Snapshots the document as it currently stands at `current_version + 1`.
        Such a version carries `is_auto: false`, unlike the snapshots the service
        takes itself at creation and on every content change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVersionRequest" }
      responses:
        "201":
          description: The new version.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"

    get:
      tags: [versions]
      summary: List the version history
      description: |
        Most recent version first. Bodies are not included — fetch one at a time
        with `GET /api/v1/documents/{doc_id}/versions/{version}`, which is the
        single read whose purpose is to return a prior body.

        The whole history is returned; there is no pagination. The response
        therefore grows with the **number** of versions, and with nothing else:
        it does not grow with the size of the document. That was not true until
        2026-09-14, when the query behind this endpoint still read every body it
        does not return. See ADR-007.
      responses:
        "200":
          description: The version history.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/VersionSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/documents/{doc_id}/versions/{version}:
    parameters:
      - name: doc_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - $ref: "#/components/parameters/CorrelationId"
      - $ref: "#/components/parameters/SourceService"
    get:
      tags: [versions]
      summary: Retrieve one prior version, body included
      description: This is the read a product uses to restore a prior state.
      responses:
        "200":
          description: The version.
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/CorrelationId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OID-issued JWT. RS256 in production (`JWT_RSA_PUBLIC_KEY_B64`); HS256 is
        accepted only when `JWT_ALLOW_HS256=true`, for development. The token
        must carry `sub` and `tenant_id`.

  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Trace identifier. Adopted when supplied, generated otherwise, and always
        echoed back on the response.
      schema: { type: string }
    SourceService:
      name: X-Source-Service
      in: header
      required: false
      description: The calling ODS service, for log correlation.
      schema: { type: string }

  headers:
    CorrelationId:
      description: The correlation id used for this request.
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request or forbidden status transition.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed or expired token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        No such resource for this tenant. Another tenant's resource is reported
        the same way, deliberately: a distinguishable response would be an
        existence oracle across tenants.

        An identifier this service cannot even parse — `/documents/not-a-uuid`,
        `/versions/abc` — is reported the same way too, and in this same shape:
        a path that cannot name a resource names no resource. So is a request
        matching no route at all. Every refusal this service makes carries the
        `Error` body below; none of them is `text/plain`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: The request was well-formed but a value is unacceptable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: |
        The request was too long to read at all — distinct from a document that
        is merely too big, which is read and refused with `422`.

        The two ceilings are not the same number, deliberately. The **document**
        ceiling is `MAX_DOCUMENT_SIZE_MB` — 2097152 bytes by default — and
        applies to `content` as stored. The **payload** ceiling applies to the
        whole request and is larger (`2 x` the document ceiling `+ 64 KiB`), so
        that a document of exactly the documented maximum is always carryable
        whatever JSON escaping does to it. Reaching the payload ceiling means
        the request could not be read, and the message names both numbers.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    DocumentStatus:
      type: string
      enum: [draft, published, archived]

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          # Exactly the codes src/error.rs can put on the wire, kept so by
          # tests/error_surface.rs. `conflict` and `forbidden` were listed
          # here until 2026-09-13 and no branch of the service could ever
          # produce them.
          enum:
            - validation_error
            - not_found
            - unauthorized
            - bad_request
            - payload_too_large
            - internal_error
        message: { type: string }

    CreateDocumentRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: |
            Non-blank once trimmed, and stored trimmed — `"   Contrat   "` is
            created and renamed as `"Contrat"`, on both paths.

            `maxLength` is a count of **characters**, as it is everywhere in
            JSON Schema and as `VARCHAR(500)` is in PostgreSQL: 500 accented or
            Chinese characters are accepted as readily as 500 ASCII ones. The
            service counted bytes until 2026-09-14, which made the real maximum
            500, 250 or 166 characters depending on the alphabet.
        content:
          type: string
          description: |
            The document body — HTML, Markdown or JSON, as the calling product
            prefers; DocEditor stores it verbatim. Mutually exclusive with
            `template_id`.

            At most **2097152 bytes** of UTF-8 (2 MiB) unless the deployment
            sets `MAX_DOCUMENT_SIZE_MB` otherwise — and **bytes**, not
            characters, which is why this field carries no `maxLength`: that
            keyword counts characters, and a body of Chinese text reaches the
            ceiling in a third of them. The service counts what storage costs.

            That bound is on the body as **stored**, not on the request that
            carries it: a body of exactly the maximum is accepted whatever JSON
            escaping does to its size. Over the maximum is a `422` naming the
            limit; a request too long to read at all is a `413`.

            2 MiB and not the 10 MiB published until 2026-09-14: the ceiling,
            the instance memory and the number of requests served at once are
            one setting in three parts, and at 10 MiB eleven concurrent
            full-size saves killed the instance — not the requests, the
            instance, and with it every other tenant's in-flight request. At
            2 MiB the platform's default concurrency of 80 peaks at two thirds
            of the memory. See ADR-009.

            Stored verbatim means exactly that: the body is neither parsed,
            sanitised nor escaped by this service, and it is returned as it was
            sent. A product that renders it as HTML owns that boundary and must
            sanitise on its side. See ADR-001.
        template_id:
          type: [string, "null"]
          format: uuid
          description: |
            Start from this template's body. Visible templates are the tenant's
            own plus the platform's system templates. Mutually exclusive with
            `content`.
        metadata:
          $ref: "#/components/schemas/Metadata"
      examples:
        - title: Contrat de prestation
          content: "<h1>Article 1</h1><p>Les parties conviennent.</p>"
          metadata: { kind: contract }

    UpdateDocumentRequest:
      type: object
      description: Every field is optional; omitted fields are left untouched.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: Same rule as on creation — trimmed, and counted in characters.
        status: { $ref: "#/components/schemas/DocumentStatus" }
        content:
          type: string
          description: |
            Supplying this advances the version and snapshots it. Bounded
            exactly as on creation: at most **2097152 bytes** of UTF-8 (2 MiB)
            by default, counted in bytes and therefore carrying no `maxLength`.
        metadata:
          $ref: "#/components/schemas/Metadata"

    CreateVersionRequest:
      type: object
      properties:
        comment:
          type: [string, "null"]
          maxLength: 500
          description: |
            Why this snapshot was taken. Stored verbatim (not trimmed), and
            bounded in **characters**, like every other bound here.

    Metadata:
      type: object
      description: |
        At most 20 keys, and at most 32 KiB once serialised. Keys match
        `^[a-z][a-z0-9_]{0,63}$`; string values are at most 256 **characters** —
        counted as characters and not as bytes, so the bound does not move with
        the alphabet.

        Both bounds are enforced at **every depth**, and neither is redundant.
        The character bound holds whatever container a string sits in: a value
        of the object, a value nested inside one, an element of an array. Until
        2026-09-14 it was applied to the object's own values only, so wrapping
        the same string in `{}` or `[]` stored five megabytes in a field whose
        documented maximum is 256 characters. The size bound holds whatever
        shape the value takes, which is what the character bound cannot see: an
        array of a million admissible strings breaks no per-value rule.

        The size bound is not a new product limit. It is the allowance the
        payload ceiling is already computed from (`2 x MAX_DOCUMENT_SIZE_MB +
        64 KiB`, where the 64 KiB covers the title, this field and the
        punctuation around them), and it matters because `DocumentSummary`
        carries `metadata` while deliberately dropping `content`: a page
        multiplies this field by up to 100. See ADR-008.

        `type: object` is enforced, and not merely declared: every per-key rule
        is stated about keys, so a string, a number, a boolean or an array would
        satisfy all of them vacuously. Any of those is a `422`.
      maxProperties: 20
      additionalProperties: true

    DocumentSummary:
      type: object
      description: A document without its body, as returned by the list endpoint.
      required:
        [
          id,
          tenant_id,
          title,
          status,
          created_by,
          created_at,
          updated_at,
          current_version,
          word_count,
          metadata,
        ]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
        current_version: { type: integer, minimum: 1 }
        word_count:
          type: integer
          description: |
            Whitespace-separated word count of the body. A display hint: markup
            is not stripped, so it is approximate on HTML.
        metadata: { $ref: "#/components/schemas/Metadata" }

    Document:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: The document body at `current_version`.

    VersionSummary:
      type: object
      description: A version record without its body.
      required: [version, created_at, created_by, snapshot_size_bytes]
      properties:
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        snapshot_size_bytes:
          type: integer
          description: Size of the snapshotted body, in bytes.
        comment: { type: [string, "null"] }
        is_auto:
          type: boolean
          description: |
            `true` when the service took the snapshot itself (document creation,
            content change); `false` when a product asked for it explicitly.

    Version:
      allOf:
        - $ref: "#/components/schemas/VersionSummary"
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: The immutable body of this version.
